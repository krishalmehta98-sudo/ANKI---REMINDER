<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anki Reminder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F0F0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anki">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --accent:#4FC3DC; --bg:#0F0F0F; --card:#1A1A1A; --card2:#222; --line:#2A2A2A;
  --text:#F2F2F2; --muted:#8A8A8A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:680px;display:flex;flex-direction:column;min-height:100vh}
header{padding:22px 22px 14px;border-bottom:1px solid var(--line)}
h1{font-size:25px;font-weight:700;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.5}
main{flex:1;padding:18px 22px 120px}
.screen{display:none}.screen.active{display:block}

/* generic */
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#0A0A0A;border-color:var(--accent)}
.btn.danger{color:#E06A6A}
.btn.sm{padding:5px 9px;font-size:12px}
.wide{width:100%;padding:13px;font-size:15px;border-radius:11px;margin-bottom:14px}
.link{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:0}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:34px 14px;line-height:1.6}
.sect{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1.2px;margin:22px 0 10px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:20px;
  padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer}
.chip.on{background:var(--accent);color:#0A0A0A;border-color:var(--accent)}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:12px 0 16px}
.tab{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.7px;
  padding:10px 0;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.datebar{background:var(--card);border-radius:12px;padding:13px;text-align:center;font-weight:700;font-size:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.stat{background:var(--card);border-radius:12px;padding:15px 8px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--accent)}
.stat span{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.6px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-size:16px}
.navbtn{background:var(--card);border:1px solid var(--line);color:var(--text);width:34px;height:34px;
  border-radius:9px;cursor:pointer;font-size:15px}
.navbtn:hover{border-color:var(--accent)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.dow span{text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;padding:4px 0}
.dow span.we{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{aspect-ratio:1;background:var(--card);border:1px solid transparent;border-radius:10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
  font-size:14.5px;font-weight:700;user-select:none;transition:.12s}
.day.we{background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.day:hover{border-color:var(--accent)}
.day.out{opacity:.25;font-weight:500;cursor:default}
.day.out:hover{border-color:transparent}
.day .cnt{font-size:10px;font-weight:700;color:var(--accent)}
.day.today{outline:1px solid var(--accent)}
.day.sel{background:var(--accent);color:#0A0A0A}
.day.sel .cnt{color:#0A0A0A}
.hint{text-align:center;color:var(--muted);font-size:11.5px;margin:12px 0 16px}

/* cards */
.task{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:11px}
.task.hi{border-color:var(--accent)}
.trow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}
.ttitle{font-size:15.5px;font-weight:700;line-height:1.35}
.ttitle.done{text-decoration:line-through;opacity:.55}
.ttime{color:var(--muted);font-size:12.5px;margin-top:4px}
.caret{color:var(--muted);font-size:11px;transition:.15s}
.task.open .caret{transform:rotate(180deg)}
.tbody{display:none;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.task.open .tbody{display:block}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.pill{font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:20px;
  background:var(--card2);color:var(--muted);display:inline-block}
.pill.p-high{color:#E06A6A}.pill.p-med{color:#E0B45A}.pill.acc{color:var(--accent)}
.comment{background:var(--card2);border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:7px;line-height:1.5}
.comment small{display:block;color:var(--muted);font-size:11px;margin-top:4px}

/* rich text */
.rt{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:11px;
  min-height:90px;font-size:14px;line-height:1.6;outline:none}
.rt:focus{border-color:var(--accent)}
.rt img{max-width:100%;border-radius:8px;margin:6px 0}
.rt ul,.rt ol{margin-left:20px}
.rt h1{font-size:19px;margin:6px 0}.rt h2{font-size:16px;margin:6px 0}
.rt-view{font-size:14px;line-height:1.6}
.rt-view img{max-width:100%;border-radius:8px;margin:6px 0}
.rt-view ul,.rt-view ol{margin-left:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;background:var(--card2);border:1px solid var(--line);
  border-bottom:none;border-radius:9px 9px 0 0;padding:6px}
.toolbar+.rt{border-radius:0 0 9px 9px}
.tb{background:none;border:none;color:var(--text);width:30px;height:28px;border-radius:6px;
  cursor:pointer;font-size:13px;font-family:inherit}
.tb:hover{background:var(--card)}
.tb.w{width:auto;padding:0 8px;font-size:12px;font-weight:700}

/* forms */
.nokey{background:var(--card2);border:1px dashed var(--line);border-radius:11px;padding:11px 13px;
  margin-bottom:12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap}
.remcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}
.remhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.remno{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted)}
.remx{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 5px;line-height:1}
.remx:hover{color:#e06a6a}
.remlbl{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--muted);margin:9px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card2);
  color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#08131a}
.remfire{margin-top:10px;font-size:12px;color:var(--muted)}
.remfire b{color:var(--accent)}
.field{margin-bottom:11px}
.camInner{position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column}
#camVid{flex:1;width:100%;object-fit:contain;background:#000}
.camBar{display:flex;gap:10px;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:#000}
.camBar .btn{flex:1;padding:14px}
.ck{display:flex;align-items:flex-start;gap:9px;margin:3px 0;line-height:1.5}
.ck>input[type=checkbox]{margin:4px 0 0;width:16px;height:16px;flex:0 0 auto;accent-color:var(--accent);cursor:pointer}
.ck>span{flex:1;min-width:0}
.ck.done>span{opacity:.5;text-decoration:line-through}
.dowpick{display:flex;gap:6px;margin:0 0 11px}
.dowchip{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.dowchip.on{background:var(--accent);border-color:var(--accent);color:#08131a}
.field .hint{text-align:left;margin:5px 0 0;font-size:11px}
.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px;letter-spacing:.4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:9px;padding:11px 12px;font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* notes */
.ncard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:11px;padding:14px;margin-bottom:11px;cursor:pointer}
.ncard h4{font-size:15px;margin-bottom:5px}
.snip{color:var(--muted);font-size:13px;line-height:1.5;max-height:42px;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{background:var(--card2);color:var(--accent);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px}
.media{width:100%;border-radius:10px;margin-bottom:10px;display:block}

/* settings */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;
  display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600}
.opt.on{border-color:var(--accent)}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}

/* anki bubble */
.anki{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:16px}
.anki-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#0A0A0A;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.anki-head b{font-size:15px}.anki-head span{color:var(--muted);font-size:11.5px}
.log{max-height:230px;overflow-y:auto;margin-bottom:11px;display:flex;flex-direction:column;gap:7px}
.bub{max-width:85%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.5}
.bub.a{background:var(--card2);align-self:flex-start;border-bottom-left-radius:5px}
.bub.u{background:var(--accent);color:#0A0A0A;align-self:flex-end;border-bottom-right-radius:5px;font-weight:600}
.prop{background:var(--card2);border:1px dashed var(--accent);border-radius:12px;padding:13px;margin-top:11px}
.prop .it{font-size:13.5px;line-height:1.5;padding:6px 0;border-bottom:1px solid var(--line)}
.prop .it:last-of-type{border:none}

/* alarm */
#alarm{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:656px;
  background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:14px;z-index:55;
  box-shadow:0 8px 30px rgba(0,0,0,.5);display:none}
#alarm.on{display:block;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.toggle{display:flex;justify-content:space-between;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:9px;font-size:13.5px;font-weight:600}
.sw{width:44px;height:25px;border-radius:20px;background:var(--card2);border:1px solid var(--line);
  position:relative;cursor:pointer;flex-shrink:0}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--muted);transition:.15s}
.sw.on i{left:21px;background:#0A0A0A}

/* nav */
nav{position:fixed;bottom:0;padding-bottom:calc(13px + env(safe-area-inset-bottom));width:100%;max-width:680px;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:9px 2px 13px}
nav button{flex:1;background:none;border:none;color:var(--muted);font-size:9.5px;font-weight:700;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav button i{font-style:normal;font-size:17px}
nav button.on{color:var(--accent)}

/* modal + toast */
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;align-items:center;
  justify-content:center;padding:18px}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:80vh;overflow:auto}
.modal h3{font-size:16px;margin-bottom:14px}
#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0A0A0A;
  padding:10px 18px;border-radius:22px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
.busy{color:var(--muted);font-size:13px;padding:8px 0}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Anki Reminder</h1>
    <div class="sub" id="hdrSub"></div>
  </header>
  <main>
    <section id="s-home" class="screen"></section>
    <section id="s-calendar" class="screen"></section>
    <section id="s-review" class="screen"></section>
    <section id="s-voice" class="screen"></section>
    <section id="s-scan" class="screen"></section>
    <section id="s-notes" class="screen"></section>
    <section id="s-settings" class="screen"></section>
  </main>
  <nav id="nav"></nav>
</div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="alarm"></div>
<div id="toast"></div>
<input type="file" id="hiddenFile" accept="image/*" style="display:none">

<script>
/* ============ storage ============ */
const KEY='anki-reminder-v2';
function load(){ try{ const r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function persist(){
  pushSchedule();
  try{ localStorage.setItem(KEY,JSON.stringify(D)); S.storageWarned=false; }
  catch(e){ if(!S.storageWarned){ S.storageWarned=true; toast('Storage full — remove some images or shorten a repeat') } }
  if(typeof fbPush==='function') fbPush();
}

const TODAY=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const T_ISO=iso(TODAY);
const DOWS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const SEED={
  seq:200, theme:'teal', mood:'energized', aiKey:'',
  chat:[], reminders:false, alarmSound:true, snoozeMin:10, me:'', group:null, fbCfg:'', members:[], role:'owner',
  tasks:[
    {id:1,date:T_ISO,title:'Take medication',time:'09:00',status:'open',priority:'high',html:'<p>Kitchen counter, with breakfast.</p>',comments:[],noteIds:[]},
    {id:2,date:T_ISO,title:'Drink water',time:'10:30',status:'open',priority:'low',html:'',comments:[],noteIds:[]},
    {id:3,date:T_ISO,title:'Morning walk',time:'07:30',status:'progress',priority:'med',html:'<p>20 minutes around the block.</p>',comments:[{id:11,text:'Did 12 min, knee sore',at:Date.now()}],noteIds:[]},
    {id:4,date:T_ISO,title:'Log breakfast',time:'08:15',status:'done',priority:'low',html:'',comments:[],noteIds:[]},
    {id:5,date:'2026-07-30',title:'Doctor appointment',time:'11:00',status:'open',priority:'high',html:'<p>Bring last reports.</p>',comments:[],noteIds:[]},
    {id:6,date:'2026-07-30',title:'Refill prescription',time:'16:00',status:'progress',priority:'med',html:'',comments:[],noteIds:[]},
    {id:7,date:'2026-07-31',title:'Blood test',time:'08:00',status:'open',priority:'high',html:'<p>Fasting from 10pm.</p>',comments:[],noteIds:[]},
    {id:8,date:'2026-08-02',title:'Weekly review',time:'18:00',status:'open',priority:'med',html:'',comments:[],noteIds:[]},
    {id:9,date:'2026-08-02',title:'Grocery run',time:'12:00',status:'open',priority:'low',html:'',comments:[],noteIds:[]}
  ],
  notes:[{id:20,title:'Questions for the doctor',html:'<ul><li>Dosage timing</li><li>Side effects</li></ul>',
    tags:['health'],taskId:5,pinned:true,at:Date.now(),updated:Date.now()}],
  voice:[], scans:[]
};

let D = load() || JSON.parse(JSON.stringify(SEED));
D.chat=D.chat||[]; D.reminders=D.reminders||false; D.alarmSound=D.alarmSound!==false; D.snoozeMin=D.snoozeMin||10;
D.defRem=D.defRem||[{off:0,type:'both'}];
D.me=D.me||''; D.group=D.group||null; D.fbCfg=D.fbCfg||''; D.members=D.members||[]; D.role=D.role||'owner';
D.tasks.forEach(t=>{ if(!t.reminders) t.reminders = t.alarm===false?[]:[{id:++D.seq,off:0,type:'both'}]; });
const nid = () => ++D.seq;

const THEMES={
  teal:{accent:'#4FC3DC',bg:'#0F0F0F',card:'#1A1A1A',card2:'#222222',line:'#2A2A2A',text:'#F2F2F2',muted:'#8A8A8A',label:'Teal'},
  sage:{accent:'#7DB89F',bg:'#0F0F0F',card:'#1A1A1A',card2:'#222222',line:'#2A2A2A',text:'#F2F2F2',muted:'#8A8A8A',label:'Sage Green'},
  purple:{accent:'#9B8DC7',bg:'#0F0F0F',card:'#1A1A1A',card2:'#222222',line:'#2A2A2A',text:'#F2F2F2',muted:'#8A8A8A',label:'Muted Purple'},
  coral:{accent:'#E07856',bg:'#F9F7F4',card:'#FFFFFF',card2:'#F1EEE9',line:'#E3DED6',text:'#22201E',muted:'#8A8378',label:'Coral'},
  peach:{accent:'#D68A6F',bg:'#F9F7F4',card:'#FFFFFF',card2:'#F1EEE9',line:'#E3DED6',text:'#22201E',muted:'#8A8378',label:'Warm Peach'},
  rose:{accent:'#C484A0',bg:'#F9F7F4',card:'#FFFFFF',card2:'#F1EEE9',line:'#E3DED6',text:'#22201E',muted:'#8A8378',label:'Muted Rose'}
};
const MOODS={energized:'🔋 Energized',neutral:'😐 Neutral',overwhelmed:'😰 Overwhelmed',moody:'😔 Moody'};

function normalizeData(d){
  if(!d||typeof d!=='object'||Array.isArray(d)) throw new Error('bad shape');
  const arr=v=>Array.isArray(v)?v:[];
  d.tasks=arr(d.tasks); d.notes=arr(d.notes); d.chat=arr(d.chat);
  d.voice=arr(d.voice); d.scans=arr(d.scans); d.members=arr(d.members);
  d.theme=THEMES[d.theme]?d.theme:'teal';
  d.mood=MOODS[d.mood]?d.mood:'energized';
  d.aiKey=typeof d.aiKey==='string'?d.aiKey:'';
  d.me=typeof d.me==='string'?d.me:'';
  d.fbCfg=typeof d.fbCfg==='string'?d.fbCfg:'';
  d.group=d.group||null; d.role=d.role||'owner';
  d.reminders=!!d.reminders; d.alarmSound=d.alarmSound!==false;
  d.snoozeMin=+d.snoozeMin>0?+d.snoozeMin:10;
  d.defRem=arr(d.defRem).length?d.defRem:[{off:0,type:'both'}];
  d.tasks=d.tasks.filter(t=>t&&typeof t==='object');
  d.notes=d.notes.filter(n=>n&&typeof n==='object');
  let max=0;
  const bump=x=>{ const n=+x; if(isFinite(n)&&n>max) max=n };
  d.tasks.forEach(t=>{
    bump(t.id);
    t.title=typeof t.title==='string'?t.title:'Untitled';
    t.date=/^\d{4}-\d{2}-\d{2}$/.test(t.date)?t.date:T_ISO;
    t.time=/^\d{2}:\d{2}$/.test(t.time)?t.time:'09:00';
    t.status=['open','progress','done'].includes(t.status)?t.status:'open';
    t.priority=['low','med','high'].includes(t.priority)?t.priority:'low';
    t.html=typeof t.html==='string'?t.html:'';
    t.comments=arr(t.comments); t.noteIds=arr(t.noteIds);
    t.reminders=arr(t.reminders).filter(r=>r&&typeof r==='object');
    t.reminders.forEach(r=>{ bump(r.id); r.off=+r.off||0;
      r.type=['both','alarm','push','silent'].includes(r.type)?r.type:'both'; });
    t.repeat=['off','daily','weekdays','week','month','custom','dates'].includes(t.repeat)?t.repeat:'off';
    t.repeatDays=arr(t.repeatDays).map(Number).filter(n=>n>=0&&n<=6);
    t.repeatDates=arr(t.repeatDates).map(Number).filter(n=>n>=1&&n<=31);
    t.repeatUntil=/^\d{4}-\d{2}-\d{2}$/.test(t.repeatUntil)?t.repeatUntil:null;
    t.skip=arr(t.skip).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));
  });
  d.notes.forEach(n=>{ bump(n.id); n.title=typeof n.title==='string'?n.title:'Note';
    n.html=typeof n.html==='string'?n.html:''; n.tags=arr(n.tags); });
  const ids=new Set();
  d.tasks.forEach(t=>{ if(!isFinite(+t.id)||ids.has(t.id)) t.id=++max; ids.add(t.id) });
  if(!isFinite(+d.seq)||+d.seq<max) d.seq=max+1;
  return d;
}

/* ============ repeat + carry-forward ============ */
function shiftDay(isoStr,n){
  const d=new Date(isoStr+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d);
}
function repeatLabel(t){
  if(!t.repeat||t.repeat==='off') return '';
  const D3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let base={daily:'Daily',weekdays:'Weekdays',week:'Weekly',month:'Monthly'}[t.repeat];
  if(t.repeat==='custom') base=((t.repeatDays||[]).map(i=>D3[i]).join(' ')||'Custom');
  if(t.repeat==='dates') base=(t.repeatDates||[]).length?('Dates '+t.repeatDates.join(',')):'Dates';
  return base+(t.repeatUntil?' \u2192 '+fmtShort(t.repeatUntil):'');
}
const REPEAT_HORIZON=60;
const REPEAT_MAX_PER_SEED=250;
function repeatDueOn(t,day){
  if(!t.repeat||t.repeat==='off') return false;
  if(t.skip&&t.skip.includes(day)) return false;
  if(t.repeatUntil&&day>t.repeatUntil) return false;
  if(day<=t.date) return false;
  const start=new Date(t.date+'T00:00:00'), on=new Date(day+'T00:00:00');
  const dow=on.getDay(), dom=on.getDate();
  const days=Math.round((on-start)/86400000);
  if(t.repeat==='daily') return true;
  if(t.repeat==='weekdays') return dow>0&&dow<6;
  if(t.repeat==='week') return days%7===0;
  if(t.repeat==='month'){
    const want=start.getDate(), dim=new Date(on.getFullYear(),on.getMonth()+1,0).getDate();
    return dom===Math.min(want,dim);
  }
  if(t.repeat==='custom') return (t.repeatDays||[]).includes(dow);
  if(t.repeat==='dates') return (t.repeatDates||[]).includes(dom);
  return false;
}
function repeatDueToday(t){ return repeatDueOn(t,T_ISO) }
function seedCopy(seed,day){
  return {...seed,id:nid(),date:day,status:'open',repeatOf:seed.id,carryFrom:null,skip:[],
    comments:[],
    repeatDays:(seed.repeatDays||[]).slice(),
    repeatDates:(seed.repeatDates||[]).slice(),
    repeatUntil:seed.repeatUntil||null,
    reminders:(seed.reminders||[]).map(r=>({...r,id:nid(),snoozeAt:null}))};
}
function materializeRepeats(){
  const seeds=[], byId={};
  for(const t of D.tasks){ if(t.repeat&&t.repeat!=='off'&&!t.repeatOf){ seeds.push(t); byId[t.id]=t } }
  const lastFor={};
  for(const s of seeds){
    const cap=shiftDay(T_ISO, s.repeatUntil?365:REPEAT_HORIZON);
    lastFor[s.id]=(s.repeatUntil&&s.repeatUntil<cap)?s.repeatUntil:cap;
  }
  const have={};
  const kept=[];
  for(const t of D.tasks){
    if(!t.repeatOf){ kept.push(t); continue }
    const seed=byId[t.repeatOf];
    if(!seed) continue;
    if(t.date>lastFor[seed.id]||!repeatDueOn(seed,t.date)) continue;
    (have[seed.id]||(have[seed.id]={}))[t.date]=1;
    kept.push(t);
  }
  if(kept.length!==D.tasks.length) D.tasks=kept;
  for(const s of seeds){
    const seen=have[s.id]||{}, last=lastFor[s.id];
    let made=0, day=T_ISO;
    while(day<=last&&made<REPEAT_MAX_PER_SEED){
      if(!seen[day]&&repeatDueOn(s,day)){ D.tasks.push(seedCopy(s,day)); made++ }
      day=shiftDay(day,1);
    }
  }
}
function expandRepeatingAndCarryForward(){ materializeRepeats(); carryForward() }
function carryForward(){
  const y=shiftDay(T_ISO,-1);
  D.tasks.filter(t=>t.date===y&&t.status!=='done').forEach(t=>{
    if(t.repeat&&t.repeat!=='off') return;
    if(t.repeatOf) return;
    if(D.tasks.some(x=>x.date===T_ISO&&x.carryFrom&&x.title===t.title)) return;
    t.date=T_ISO; t.carryFrom=y;
  });
}

async function ankiPlan(text){

/* works with no API key at all */
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parseUntil(text){
  const low=text.toLowerCase();
  const m=low.match(/\b(?:till|until|upto|up to|through|thru)\s+(\d{1,2})(?:st|nd|rd|th)?\s*([a-z]{3,9})?/);
  if(!m) return null;
  const day=+m[1]; if(day<1||day>31) return null;
  const base=new Date(T_ISO+'T00:00:00');
  let mo=base.getMonth(), yr=base.getFullYear();
  if(m[2]){
    const hit=MONTHS.findIndex(x=>m[2].startsWith(x));
    if(hit>-1){ if(hit<mo) yr++; mo=hit; }
  } else if(day<base.getDate()){ mo++; if(mo>11){mo=0;yr++} }
  return iso(new Date(yr,mo,day));
}
function parseDateList(text){
  const low=text.toLowerCase();
  const range=low.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s*(?:to|-|–|through|thru)\s*(\d{1,2})(?:st|nd|rd|th)?\b/);
  if(range){
    const a=+range[1], b=+range[2];
    if(a>=1&&b<=31&&a<b){ const out=[]; for(let d=a;d<=b;d++) out.push(d); return out; }
  }
  const listPart=low.match(/(\d{1,2}(?:st|nd|rd|th)?\s*(?:,|and)\s*\d{1,2}(?:st|nd|rd|th)?(?:\s*(?:,|and)\s*\d{1,2}(?:st|nd|rd|th)?)*)/);
  if(listPart){
    const nums=(listPart[1].match(/\d{1,2}/g)||[]).map(Number).filter(d=>d>=1&&d<=31);
    if(nums.length>1) return [...new Set(nums)].sort((a,b)=>a-b);
  }
  return [];
}
function detectRepeat(text){
  const low=text.toLowerCase();
  const until=parseUntil(text);
  const wrap=o=>({repeatDays:[],repeatDates:[],repeatUntil:until,...o});
  if(/every ?day|daily|each day/.test(low)) return wrap({repeat:'daily'});
  if(/weekday/.test(low)) return wrap({repeat:'weekdays'});
  if(/every ?week|weekly|each week/.test(low)) return wrap({repeat:'week'});
  if(/every ?month|monthly|each month/.test(low)) return wrap({repeat:'month'});
  const abbr=['sun','mon','tue','wed','thu','fri','sat'];
  const picked=abbr.map((a,i)=>low.includes(a)?i:-1).filter(i=>i>-1);
  if(picked.length>1) return wrap({repeat:'custom',repeatDays:picked});
  const dates=parseDateList(text);
  if(dates.length>1) return wrap({repeat:'dates',repeatDates:dates});
  return wrap({repeat:'off',repeatUntil:null});
}
function cleanTitle(t){
  return t
    .replace(/^\s*(please\s+)?(can you\s+)?(set|add|create|make|put)\s+(a\s+|an\s+)?(reminder|task|alarm|todo)\s*(for|to|at|on)?\s*/i,'')
    .replace(/^\s*remind me\s*(to|about|at|on)?\s*/i,'')
    .replace(/\b(?:till|until|upto|up to|through|thru)\s+\d{1,2}(?:st|nd|rd|th)?\s*[a-z]{0,9}/ig,'')
    .replace(/\b(on|from|between|for)?\s*\d{1,2}(?:st|nd|rd|th)?\s*(?:to|-|–|through|thru)\s*\d{1,2}(?:st|nd|rd|th)?\b/ig,'')
    .replace(/\b(on|for)?\s*\d{1,2}(?:st|nd|rd|th)?\s*(?:,|and)\s*\d{1,2}(?:st|nd|rd|th)?(?:\s*(?:,|and)\s*\d{1,2}(?:st|nd|rd|th)?)*/ig,'')
    .replace(/\bevery ?(day|week|month)\b/ig,'')
    .replace(/\b(daily|weekly|monthly|weekdays?|everyday)\b/ig,'')
    .replace(/\beach (day|week|month)\b/ig,'')
    .replace(/\b(at|on|by|from)\s*\d{1,2}(:\d{2})?\s*(am|pm)?/ig,'')
    .replace(/\b\d{1,2}(:\d{2})?\s*(am|pm)\b/ig,'')
    .replace(/\b(today|tomorrow|day after)\b/ig,'')
    .replace(/\b(sun|mon|tues?|wed(nes)?|thur?s?|fri|sat(ur)?)(day)?\b/ig,'')
    .replace(/^\s*(to|for|at|on|of)\s+/i,'')
    .replace(/\s{2,}/g,' ').replace(/^[\s,\-–.]+|[\s,\-–.]+$/g,'').trim();
}
function normalizePlan(plan,text){
  const rep=detectRepeat(text);
  (plan.tasks||[]).forEach(t=>{
    if(!t.repeat||t.repeat==='off'){
      t.repeat=rep.repeat; t.repeatDays=rep.repeatDays; t.repeatDates=rep.repeatDates;
    }
    if(!t.repeatUntil) t.repeatUntil=rep.repeatUntil;
    const c=cleanTitle(t.title||text);
    if(c) t.title=c.slice(0,70);
  });
  if(plan.tasks&&plan.tasks.length){
    const t=plan.tasks[0];
    const lbl={daily:'every day',weekdays:'weekdays',week:'every week',month:'every month',
      custom:'chosen weekdays',dates:'days '+(t.repeatDates||[]).join(', '),off:''}[t.repeat]||'';
    plan.reply=`Got it — "${t.title}" at ${fmtTime(t.time)}`
      +(lbl?`, repeats ${lbl}`:` on ${fmtShort(t.date)}`)
      +(t.repeatUntil?` until ${fmtShort(t.repeatUntil)}`:'')+'. Add it?';
  }
  return plan;
}
function stripRepeatWords(t){ return cleanTitle(t); }
function localPlan(text){
  const d=new Date(T_ISO+'T00:00:00'); let date=T_ISO;
  const low=text.toLowerCase();
  if(/\btomorrow\b/.test(low)){d.setDate(d.getDate()+1);date=iso(d)}
  else if(/\bday after\b/.test(low)){d.setDate(d.getDate()+2);date=iso(d)}
  else{
    const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    const hit=days.findIndex(x=>low.includes(x));
    if(hit>-1){const diff=(hit-d.getDay()+7)%7||7;d.setDate(d.getDate()+diff);date=iso(d)}
  }
  let time='09:00';
  const m=low.match(/(?:at\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if(m){
    let h=+m[1]; const mi=m[2]||'00';
    if(m[3]==='pm'&&h<12)h+=12;
    if(m[3]==='am'&&h===12)h=0;
    if(!m[3]&&h<=7)h+=12;
    if(h<24) time=`${String(h).padStart(2,'0')}:${mi}`;
  }
  const title=text.replace(/\b(at|on|by)\s*\d{1,2}(:\d{2})?\s*(am|pm)?/ig,'')
    .replace(/\b(today|tomorrow|day after)\b/ig,'').replace(/\s{2,}/g,' ').trim();
  const rep=detectRepeat(text);
  const clean=stripRepeatWords(title||text)||(title||text);
  const repLabel={daily:' \u00b7 repeats every day',weekdays:' \u00b7 repeats weekdays',week:' \u00b7 repeats weekly',month:' \u00b7 repeats monthly',custom:' \u00b7 repeats on chosen days',off:''}[rep.repeat];
  return {reply:`Got it \u2014 "${clean}" on ${fmtShort(date)} at ${fmtTime(time)}${repLabel}. Add it?`,
    tasks:[{title:clean.slice(0,70),date,time,priority:'med',notes:'',repeat:rep.repeat,repeatDays:rep.repeatDays}],notes:[]};
}

      repeat:t.repeat||'off',repeatDays:t.repeatDays||[],repeatDates:t.repeatDates||[],repeatUntil:t.repeatUntil||null});

  });
  (p.notes||[]).forEach(n=>D.notes.unshift({id:nid(),title:n.title||'Note',html:`<p>${esc(n.body||'')}</p>`,
    tags:n.tags||[],taskId:null,pinned:false,at:Date.now(),updated:Date.now()}));

  S.pending=null;
  if(edit&&last){S.date=last.date;S.revTab='open';S.screen='review';S.editTask=last.id}

/* ---- REMINDERS / ALARM ---- */
const OFFS=[[0,'At the time'],[5,'5 min before'],[10,'10 min before'],[15,'15 min before'],[30,'30 min before'],
  [60,'1 hour before'],[120,'2 hours before'],[1440,'1 day before']];
const RTYPES=[['both','🔔 Alarm + push'],['alarm','🔊 Alarm only'],['push','📱 Push only'],['silent','🔕 Silent banner']];
const offLabel=o=>(OFFS.find(x=>x[0]===+o)||[0,o+' min before'])[1];
/* ---- native alarm bridge ---- */
const NATIVE = () => typeof window!=='undefined' && !!window.ReactNativeWebView;
const SCHED_MAX = 400;
function upcomingReminders(limit){
  const out=[], now=Date.now(), cap=limit||SCHED_MAX;
  for(const t of D.tasks){
    if(t.status==='done') continue;
    if(!Array.isArray(t.reminders)) continue;
    const base=Date.parse((t.date||'')+'T'+(t.time||'09:00'));
    if(!isFinite(base)) continue;
    for(const r of t.reminders){
      if(!r||r.type==='silent') continue;
      const at=r.snoozeAt||(base-(+r.off||0)*60000);
      if(!isFinite(at)||at<=now) continue;
      out.push({
        key:String(t.id)+'_'+String(r.id),
        at,
        taskId:t.id,
        title:t.title||'Reminder',
        body:offLabel(+r.off||0)+' · '+fmtTime(t.time||'09:00'),
        loud:r.type==='both'||r.type==='alarm'
      });
    }
  }
  out.sort((a,b)=>a.at-b.at);
  return out.slice(0,cap);
}
let _schedTimer=null, _schedLast='';
function pushSchedule(){
  if(!NATIVE()) return;
  clearTimeout(_schedTimer);
  _schedTimer=setTimeout(()=>{
    try{
      const items=upcomingReminders();
      const sig=JSON.stringify(items.map(i=>i.key+'@'+i.at));
      if(sig===_schedLast) return;
      _schedLast=sig;
      window.ReactNativeWebView.postMessage(JSON.stringify({type:'schedule',items}));
    }catch(e){}
  },800);
}
function onNativeMessage(raw){
  let m; try{ m=JSON.parse(raw) }catch(e){ return }
  if(m.type==='open-task'&&m.taskId!=null){
    const t=task(m.taskId);
    if(t){ S.screen='review'; S.date=t.date; S.revTab=t.status; S.editTask=t.id; render() }
  }
  if(m.type==='resend'){ _schedLast=''; pushSchedule() }
}

const remDue=(t,r)=>r.snoozeAt||(Date.parse(t.date+'T'+(t.time||'09:00'))-r.off*60000);
function checkReminders(){
  if(!D.reminders||S.alarm) return;
  const now=Date.now();
  for(const t of D.tasks){
    if(t.status==='done') continue;
    for(const r of (t.reminders||[])){
      const due=remDue(t,r);
      if(due<=now&&now-due<12*3600e3&&r.firedFor!==due){
        r.firedFor=due; S.alarm={t:t.id,r:r.id}; persist();
        if((r.type==='both'||r.type==='push')&&window.Notification&&Notification.permission==='granted')
          new Notification('⏰ '+t.title,{body:offLabel(r.off)+' · '+fmtTime(t.time)+', '+fmtShort(t.date),tag:'anki'+r.id});
        if(r.type==='both'||r.type==='alarm') beep();
        render(false); return;
      }
    }
  }
}
function beep(){
  if(!D.alarmSound) return;
  try{
    const C=window.AudioContext||window.webkitAudioContext; const ctx=new C();
    [0,.45,.9].forEach(t=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.25,ctx.currentTime+t+.05);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.3);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.32);
    });
  }catch(e){}
}
function drawAlarm(){
  const el=$('#alarm');
  if(!S.alarm){ el.classList.remove('on'); el.innerHTML=''; return }
  const t=task(S.alarm.t);
  if(!t){ S.alarm=null; el.classList.remove('on'); return }
  const r=(t.reminders||[]).find(x=>x.id===S.alarm.r);
  el.innerHTML=`<div class="ttitle">⏰ ${esc(t.title)}</div>
    <div class="ttime">${fmtTime(t.time)} · ${fmtShort(t.date)}${r?' · '+offLabel(r.off):''}</div>
    <div class="acts">
      <button class="btn sm primary" onclick="alarmDone()">Mark done</button>
      <button class="btn sm" onclick="snooze(${D.snoozeMin})">Snooze ${D.snoozeMin}m</button>
      <button class="btn sm" onclick="snooze(60)">Snooze 1h</button>
      <button class="btn sm" onclick="S.alarm=null;openInReview('${t.date}')">Open</button>
      <button class="btn sm danger" onclick="dismissAlarm()">Dismiss</button>
    </div>`;
  el.classList.add('on');
}
function snooze(min){
  const t=task(S.alarm.t), r=t&&(t.reminders||[]).find(x=>x.id===S.alarm.r);

}
function dismissAlarm(){S.alarm=null;render()}

function askNotify(){
  if(!window.Notification){ D.reminders=!D.reminders; return render() }
  if(!D.reminders){

function parseDatesInput(v){
  v=(v||'').trim(); if(!v) return [];
  const out=new Set();
  v.split(',').forEach(part=>{
    part=part.trim().replace(/(st|nd|rd|th)/gi,'');
    const r=part.match(/^(\d{1,2})\s*[-–to]+\s*(\d{1,2})$/i);
    if(r){ let a=+r[1],b=+r[2]; if(a<=b) for(let d=a;d<=b;d++){ if(d>=1&&d<=31) out.add(d) } }
    else { const n=parseInt(part,10); if(n>=1&&n<=31) out.add(n) }
  });
  return [...out].sort((a,b)=>a-b);
}

function delTask(id){
  const t=task(id); if(!t) return;
  if(t.repeatOf){
    if(!confirm('Delete just this one occurrence of "'+t.title+'"?')) return;
    const seed=D.tasks.find(x=>x.id===t.repeatOf);
    if(seed) seed.skip=(seed.skip||[]).concat(t.date);
    D.tasks=D.tasks.filter(x=>x.id!==id);
  } else if(t.repeat&&t.repeat!=='off'){
    if(!confirm('Delete "'+t.title+'" and all of its repeats?')) return;
    D.tasks=D.tasks.filter(x=>x.id!==id&&x.repeatOf!==id);
  } else {
    if(!confirm('Delete "'+t.title+'"?')) return;

let rec,chunks,sr,liveText='';
async function toggleRec(){
  if(S.recording){ rec&&rec.state!=='inactive'&&rec.stop(); sr&&sr.stop(); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];liveText='';
    const pick=['audio/mp4','audio/ogg;codecs=opus','audio/webm;codecs=opus','audio/webm']
      .find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
    rec=new MediaRecorder(stream,pick?{mimeType:pick}:undefined);
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const r=new FileReader();
      r.onload=()=>{
        D.voice.unshift({id:nid(),text:(liveText||'Voice note').slice(0,60),transcript:liveText.trim(),
          audio:r.result,ai:'',at:Date.now()});
        S.recording=false;render();
      };
      r.readAsDataURL(new Blob(chunks,{type:(rec&&rec.mimeType)||'audio/webm'}));
    };
    const SRc=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SRc){sr=new SRc();sr.continuous=true;sr.interimResults=false;sr.lang='en-US';
      sr.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++) liveText+=e.results[i][0].transcript+' '};
      try{sr.start()}catch(e){}}
    rec.start();S.recording=true;render();
  }catch(e){ alert('Mic unavailable (file:// blocks it). Use "Type instead", or serve the folder over http.') }
}

/* ---- AI ---- */
function requireKey(){
  if(D.aiKey) return true;
  toast('Add your Gemini key in Settings to use AI');
  S.screen='settings'; render();
  return false;
}
const AI_URL='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent';
async function aiCall(parts,mode){
  const body=JSON.stringify({contents:[{parts}]});
  const url = mode==='query' ? AI_URL+'?key='+encodeURIComponent(D.aiKey) : AI_URL;
  const headers = mode==='query'
    ? {'Content-Type':'application/json'}
    : {'Content-Type':'application/json','x-goog-api-key':D.aiKey};
  const r=await fetch(url,{method:'POST',headers,body});
  return r.json();
}
async function aiParts(parts){
  const key=(D.aiKey||'').trim();
  if(!key) throw new Error('Add your Gemini API key in Settings first.');
  if(location.protocol==='file:')
    throw new Error('AI does not work when the file is opened directly. Open the app from its web address instead.');
  let d;
  try{ d=await aiCall(parts,'header'); }
  catch(e){ throw new Error('Network problem reaching Gemini. Check your connection.') }
  if(d && d.error && /credential|API key|UNAUTHENT|permission/i.test(d.error.message||'')){
    try{ d=await aiCall(parts,'query'); }catch(e){}
  }
  if(d && d.error){
    const m=d.error.message||'Unknown error';
    if(/credential|API key|UNAUTHENT/i.test(m))
      throw new Error('That key was rejected. Open Settings and use "Test AI key" to check it.');
    if(/quota|RESOURCE_EXHAUSTED/i.test(m)) throw new Error('Gemini quota reached. Try again later.');
    throw new Error(m);
  }
  const txt=(d&&d.candidates&&d.candidates[0]&&d.candidates[0].content&&
             d.candidates[0].content.parts&&d.candidates[0].content.parts[0]&&
             d.candidates[0].content.parts[0].text)||'';
  return txt.replace(/```html|```/g,'').trim();
}
async function testKey(){
  const key=(D.aiKey||'').trim();
  if(!key) return alert('Paste a key first, then press Save.');
  if(location.protocol==='file:')
    return alert('You have opened index.html directly from your disk.\n\nAI, the camera and offline mode only work when the app is loaded from its web address. Open the live link instead.');
  S.busy='Testing key…'; render();
  try{
    const out=await aiParts([{text:'Reply with the single word: ok'}]);
    alert(out ? 'Key works. AI features are ready.' : 'Key was accepted but returned nothing.');
  }catch(e){ alert('Key test failed.\n\n'+e.message); }
  S.busy=''; render();
}
const ai=prompt=>aiParts([{text:prompt}]);

/* send the recording itself to Gemini and get words back */
async function transcribe(id){
  const v=D.voice.find(x=>x.id===id); if(!v) return;
  if(!v.audio) return toast('No audio on this one');
  if(!requireKey()) return;
  S.busy='Transcribing…';render();
  try{
    const mime=(v.audio.match(/^data:([^;]+);/)||[])[1]||'audio/webm';
    const b64=v.audio.split(',')[1];
    v.transcript=await aiParts([
      {text:'Transcribe this audio verbatim. Return plain text only, no commentary.'},
      {inline_data:{mime_type:mime,data:b64}}
    ]);
    if(!v.text||v.text==='Voice note') v.text=v.transcript.slice(0,60);
  }catch(e){ alert('Transcription failed: '+e.message+'\n\nIf the format is rejected, use the live transcript or type it.') }
  S.busy='';render();
}

/* rewrite whatever is in a rich-text box */
async function enhance(target){
  const el=document.getElementById(target);
  if(!el) return;
  const text=(el.innerText||'').trim();
  if(!text) return toast('Nothing to enhance');
  if(!requireKey()) return;
  S.busy='Rewriting…'; render();
  try{
    const out=await ai(`Improve this writing: fix grammar and spelling, tighten it, keep the meaning and the writer's voice. Return simple HTML only.\n\n${text}`);
    const clean=(out||'').trim();
    if(clean){
      if(target==='fHtml'&&S.editTask){ const t=task(S.editTask); if(t) t.html=clean; }
      else if(target==='nBody'&&S.noteEdit){ const n=D.notes.find(x=>x.id===S.noteEdit); if(n){ n.html=clean; n.updated=Date.now(); } }
      const live=document.getElementById(target); if(live) live.innerHTML=clean;
      persist();
    }
  }catch(e){ toast('AI: '+e.message) }
  S.busy=''; render(false);
  const el3=document.getElementById(target); if(el3) el3.focus();
}
const AI_PROMPTS={
  clean:t=>`Clean up this dictated note. Fix grammar, keep the meaning and the person's voice. Return simple HTML only:\n\n${t}`,
  notes:t=>`Turn this into tidy bullet notes. Return simple HTML (<ul><li>) only:\n\n${t}`,

async function voiceAI(id,mode){

  const src=v.transcript||v.text;
  if(!src) return toast('Nothing to work with');
  S.busy='Thinking…';render();
  try{ v.ai=await ai(AI_PROMPTS[mode](src)); }
  catch(e){ toast('AI: '+e.message) }
  S.busy='';render();
}

let _camStream=null;
async function openCamera(cb){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    return alert('This browser cannot open the camera. Use "Choose file" instead.');
  if(!window.isSecureContext && location.protocol!=='http:')
    return alert('The camera needs the app to be loaded from its web address (https).\n\nYou have opened the file directly from disk. Use "Choose file", or open the live link.');
  try{
    _camStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1920}},audio:false});
  }catch(e){
    const n=e&&e.name;
    if(n==='NotAllowedError') return alert('Camera permission was blocked.\n\nClick the icon at the left of the address bar, set Camera to Allow, then reload.');
    if(n==='NotFoundError')  return alert('No camera found on this device.');
    return alert('Could not start the camera: '+(e.message||n||'unknown'));
  }
  const box=document.createElement('div');
  box.id='camWrap';
  box.innerHTML='<div class="camInner"><video id="camVid" autoplay playsinline muted></video>'
    +'<div class="camBar"><button class="btn" onclick="closeCamera()">Cancel</button>'
    +'<button class="btn primary" id="camShot">Capture</button></div></div>';
  document.body.appendChild(box);
  const v=document.getElementById('camVid');
  v.srcObject=_camStream;
  document.getElementById('camShot').onclick=()=>{
    const c=document.createElement('canvas');
    c.width=v.videoWidth||1280; c.height=v.videoHeight||960;
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    const src=c.toDataURL('image/jpeg',.9);
    closeCamera();
    cb(src,'photo-'+Date.now()+'.jpg');
  };
}
function closeCamera(){
  if(_camStream){ _camStream.getTracks().forEach(t=>t.stop()); _camStream=null }
  const b=document.getElementById('camWrap'); if(b) b.remove();
}

function toggleScan(id){
  const s=D.scans.find(x=>x.id===id);
  if(s.scan){s.scan=null;render();return}
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');
    const w=Math.min(img.width,1400),k=w/img.width;
    c.width=w;c.height=img.height*k;
    const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height),p=d.data;
    for(let i=0;i<p.length;i+=4){
      let g=p[i]*.3+p[i+1]*.59+p[i+2]*.11;
      g=g<118?0:g>150?255:(g-118)*8;
      g=Math.max(0,Math.min(255,g));
      p[i]=p[i+1]=p[i+2]=g;
    }
    x.putImageData(d,0,0);
    s.scan=c.toDataURL('image/jpeg',.8);render();toast('Scanned');
  };
  img.src=s.src;
}

        ${D.tasks.map(t=>`<option value="${t.id}" ${n.taskId===t.id?'selected':''}>${esc(t.title)} · ${fmtShort(t.date)}</option>`).join('')}

}
function saveNote(back){
  const n=note(S.noteEdit); if(!n) return;
  n.title=$('#nTitle').value.trim();
  n.html=$('#nBody').innerHTML;
  n.tags=$('#nTags').value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean);
  const tid=$('#nTask').value?Number($('#nTask').value):null;
  if(n.taskId&&n.taskId!==tid){const old=task(n.taskId);if(old)old.noteIds=(old.noteIds||[]).filter(x=>x!==n.id)}
  n.taskId=tid;
  if(tid){const t=task(tid);t.noteIds=t.noteIds||[];if(!t.noteIds.includes(n.id))t.noteIds.push(n.id)}
  n.updated=Date.now();
  if(back)S.noteEdit=null;
  render();toast('Note saved');
}
function togglePin(id){note(id).pinned=!note(id).pinned;render()}
function delNote(id){
  if(!confirm('Delete this note?'))return;
  const n=note(id);
  if(n.taskId){const t=task(n.taskId);if(t)t.noteIds=(t.noteIds||[]).filter(x=>x!==id)}
  D.notes=D.notes.filter(x=>x.id!==id);S.noteEdit=null;render();toast('Deleted');
}

function doLink(tid,nid_){

function remList(tid){
  if(tid){ const t=task(tid); if(!t) return []; if(!Array.isArray(t.reminders)) t.reminders=[]; return t.reminders }
  if(S.remFor===null&&S.screen==='settings'){ if(!Array.isArray(D.defRem)) D.defRem=[]; return D.defRem }
  if(!Array.isArray(S.formRem)) S.formRem=[];
  return S.formRem;
}
function remModal(tid){
  S.remFor=tid===undefined?null:tid;
  drawRemModal(); $('#mask').classList.add('on');
}
function drawRemModal(){
  const tid=S.remFor, list=remList(tid);
  const tk=tid?task(tid):null;
  if(tid&&!tk){ closeModal(); S.remFor=null; return }
  const timeOf=()=>{ const el=document.getElementById('fTime');
    if(tk) return tk.time; return (el&&el.value)||'09:00' };
  const fires=off=>{
    const [h,m]=timeOf().split(':').map(Number);
    const d=new Date(2000,0,2,h,m-off);
    let hh=d.getHours(), mm=String(d.getMinutes()).padStart(2,'0');
    const ap=hh>=12?'PM':'AM'; hh=hh%12||12;
    const prev=d.getDate()<2?' (prev day)':'';
    return hh+':'+mm+' '+ap+prev;
  };
  $('#modal').innerHTML=`<h3>⏰ Reminders${tk?' — '+esc(tk.title):''}</h3>
    ${list.length?list.map((r,i)=>`
      <div class="remcard">
        <div class="remhead">
          <span class="remno">Reminder ${i+1}</span>
          <button class="remx" onclick="dropRem(${i})" title="Remove">✕</button>
        </div>
        <div class="remlbl">WHEN</div>
        <div class="chips">${OFFS.map(([o,l])=>
          `<button type="button" class="chip ${+r.off===o?'on':''}" onclick="setRem(${i},'off',${o})">${l}</button>`).join('')}</div>
        <div class="remlbl">HOW</div>
        <div class="chips">${RTYPES.map(([k,l])=>
          `<button type="button" class="chip ${r.type===k?'on':''}" onclick="setRem(${i},'type','${k}')">${l}</button>`).join('')}</div>
        <div class="remfire">Fires at <b>${fires(+r.off)}</b></div>
      </div>`).join(''):'<div class="empty">No reminders yet — add one below.</div>'}
    <div class="acts">
      <button class="btn" onclick="addRem()">+ Add reminder</button>
      <button class="btn primary" onclick="closeRem()">Done</button>
    </div>`;
}
function addRem(){ const l=remList(S.remFor); l.push({id:nid(),off:l.length?0:0,type:'both',snoozeAt:null,firedFor:null}); drawRemModal() }
function setRem(i,k,v){ const r=remList(S.remFor)[i]; r[k]=k==='off'?+v:v; r.firedFor=null; r.snoozeAt=null; drawRemModal() }
function dropRem(i){ remList(S.remFor).splice(i,1); drawRemModal() }
function closeRem(){
  closeModal();
  S.remFor=null; persist(); render();
}
function closeModal(){$('#mask').classList.remove('on')}
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeModal()});

/* ---- FAMILY GROUP (Firebase sync) ---- */
const FB={db:null,uid:null,unsub:[],last:{tasks:{},notes:{}},timer:null,status:''};
const CDN='https://www.gstatic.com/firebasejs/10.12.0/';

async function fbStart(){
  if(FB.db) return true;
  let cfg; try{ cfg=JSON.parse(D.fbCfg) }catch(e){ throw new Error('Firebase config is not valid JSON') }
  const {initializeApp}=await import(CDN+'firebase-app.js');
  const fs=await import(CDN+'firebase-firestore.js');
  const {getAuth,signInAnonymously,onAuthStateChanged}=await import(CDN+'firebase-auth.js');
  const app=initializeApp(cfg);
  FB.fs=fs; FB.db=fs.getFirestore(app);
  const auth=getAuth(app);
  await signInAnonymously(auth);
  FB.uid=await new Promise(r=>onAuthStateChanged(auth,u=>u&&r(u.uid)));
  return true;
}
function groupPath(){ return 'groups/'+D.group.code }
async function fbListen(){
  const {collection,onSnapshot,doc,setDoc}=FB.fs;
  FB.unsub.forEach(u=>u()); FB.unsub=[];
  await setDoc(doc(FB.db,groupPath()+'/members',FB.uid),{name:D.me||'Someone',at:Date.now()},{merge:true});
  ['tasks','notes'].forEach(kind=>{
    FB.unsub.push(onSnapshot(collection(FB.db,groupPath()+'/'+kind),snap=>{
      const cloud=[]; FB.last[kind]={};
      snap.forEach(d=>{ const v=d.data(); cloud.push(v); FB.last[kind][d.id]=JSON.stringify(v) });
      if(kind==='tasks') D.tasks=[...D.tasks.filter(t=>t.priv),...cloud];
      else D.notes=[...D.notes.filter(n=>n.priv),...cloud];
      FB.status='Synced '+new Date().toLocaleTimeString();
      render(false); persist();
    },err=>{ FB.status='Sync error: '+err.message; render(false) }));
  });
  FB.unsub.push(onSnapshot(collection(FB.db,groupPath()+'/members'),snap=>{
    D.members=[]; snap.forEach(d=>D.members.push({uid:d.id,...d.data()}));
    const me=D.members.find(m=>m.uid===FB.uid);
    D.role=me?me.role||'viewer':'viewer';
    render(false); persist();
  }));
}
function fbPush(){
  if(!D.group||!FB.db||!canEdit()) return;
  clearTimeout(FB.timer);
  FB.timer=setTimeout(async()=>{
    const {doc,setDoc,deleteDoc}=FB.fs;
    for(const kind of ['tasks','notes']){
      const mine=(kind==='tasks'?D.tasks:D.notes).filter(x=>!x.priv);
      const seen={};
      for(const x of mine){
        const rec=JSON.parse(JSON.stringify({...x,by:x.by||D.me||'Someone',updatedAt:Date.now()}));
        delete rec.updatedAt;
        const key=String(x.id); seen[key]=1;
        const body=JSON.stringify(rec);
        if(FB.last[kind][key]!==body){
          FB.last[kind][key]=body;
          try{ await setDoc(doc(FB.db,groupPath()+'/'+kind,key),rec) }catch(e){ FB.status='Push failed: '+e.message }
        }
      }
      for(const key of Object.keys(FB.last[kind])) if(!seen[key]){
        delete FB.last[kind][key];
        try{ await deleteDoc(doc(FB.db,groupPath()+'/'+kind,key)) }catch(e){}
      }
    }
  },900);
}
const CODE=()=>Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const canEdit=()=>!D.group||D.role==='owner'||D.role==='editor';
const isOwner=()=>D.group&&D.role==='owner';
const ROLES=[['owner','👑 Owner'],['editor','✏️ Can edit'],['viewer','👀 View only']];
const roleLabel=r=>(ROLES.find(x=>x[0]===r)||['','👀 View only'])[1];

async function joinGroup(code,asOwner){
  if(!D.me.trim()) return alert('Add your name first — the family needs to know who added what.');
  code=(code||'').toUpperCase().trim();
  if(code.length<4) return alert('Enter the 6-character group code');
  FB.status='Connecting…'; render();
  try{
    await fbStart();
    const {doc,setDoc,getDoc}=FB.fs;
    D.seq += Math.floor(Math.random()*900000)+1000;   // keep ids unique across phones
    D.group={code};
    const mref=doc(FB.db,groupPath()+'/members',FB.uid);
    const existing=await getDoc(mref);
    if(!existing.exists()){
      await setDoc(doc(FB.db,'groups',code),{code,createdBy:FB.uid,at:Date.now()},{merge:true});
      await setDoc(mref,{name:D.me,role:asOwner?'owner':'viewer',at:Date.now()});
      D.role=asOwner?'owner':'viewer';
    }
    await fbListen();
    if(canEdit()) fbPush();
    FB.status='Connected';
    render();
    toast(asOwner?'Group '+code+' created':'Joined — view only until the owner gives you edit access');
  }catch(e){ FB.status=''; alert('Could not connect: '+e.message); render() }
}
async function setRole(uid,role){
  if(!isOwner()) return;
  const {doc,setDoc}=FB.fs;
  await setDoc(doc(FB.db,groupPath()+'/members',uid),{role},{merge:true});
  toast('Access updated');
}
async function removeMember(uid){
  if(!isOwner()||!confirm('Remove this person from the group?')) return;
  const {doc,deleteDoc}=FB.fs;
  await deleteDoc(doc(FB.db,groupPath()+'/members',uid));
}
function leaveGroup(){
  if(!confirm('Leave the group? Shared items stay with the others; your own copy stays on this device.')) return;
  FB.unsub.forEach(u=>u()); FB.unsub=[]; FB.last={tasks:{},notes:{}};
  D.group=null; D.members=[]; FB.status=''; render(); toast('Left the group');
}

    <div class="sect">REMINDERS</div>

          <button class="btn sm danger" onclick="leaveGroup()">Leave group</button>
        </div>
      </div>
      <div class="sect">WHO'S IN</div>
      ${D.members.map(m=>`

          ${isOwner()&&m.uid!==FB.uid?`
            <div class="field" style="margin-top:9px"><label>ACCESS</label>
              <select onchange="setRole('${m.uid}',this.value)">${ROLES.map(([k,l])=>
                `<option value="${k}" ${(m.role||'viewer')===k?'selected':''}>${l}</option>`).join('')}</select></div>

          :`<div class="ttime">${roleLabel(m.role)}</div>`}
        </div>`).join('')||'<div class="empty">Just you so far. Share the code.</div>'}`:`
      <div class="task"><div class="ttime">Share tasks and notes with family — everyone in the group sees the same
        list live, and each item shows who added it. Whoever creates the group owns it and hands out access — View only or Can edit — per person.
        Anything marked 🔒 Private stays on your phone.
        Needs a free Firebase project (yours: ankita-61918) — Firebase console → Project settings →
        Your apps → Web app → copy the config object.</div></div>
      <div class="field" style="margin-top:11px"><label>YOUR NAME</label>
        <input id="meName" value="${esc(D.me)}" placeholder="Ankita"></div>
      <div class="field"><label>FIREBASE CONFIG (JSON)</label>
        <textarea id="fbCfg" placeholder='{"apiKey":"…","authDomain":"…","projectId":"ankita-61918","appId":"…"}'>${esc(D.fbCfg)}</textarea></div>
      <button class="btn wide" onclick="saveGroupCfg()">Save details</button>

function saveGroupCfg(){
  const n=$('#meName'), c=$('#fbCfg');
  if(n) D.me=n.value.trim();
  if(c) D.fbCfg=c.value.trim();
  persist();
}
function testAlarm(){
  const t=D.tasks.find(x=>x.status!=='done')||D.tasks[0];
  if(!t) return toast('Add a task first');
  S.alarm={t:t.id,r:(t.reminders&&t.reminders[0]||{}).id}; beep(); render();
}
function exportData(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));
  a.download='anki-reminder-backup.json';a.click();
}
function importData(){
  const el=document.createElement('input');el.type='file';el.accept='.json';
  el.onchange=()=>{const r=new FileReader();
    r.onload=()=>{try{
      const incoming=normalizeData(JSON.parse(r.result));
      if(!incoming.tasks.length&&!incoming.notes.length&&!confirm('That backup has no tasks or notes. Import anyway?')) return;
      D=incoming; S.expandedFor=null; clearDraft(); render(); toast('Imported');
    }catch(e){ alert("That file isn't a valid Anki Reminder backup — nothing was changed.") }};
    r.readAsText(el.files[0])};
  el.click();
}
function wipe(){if(confirm('Delete everything and start fresh?')){D=JSON.parse(JSON.stringify(SEED));render();toast('Reset')}}

render();
